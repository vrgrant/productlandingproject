<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexboxes</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="flex-container">
        <div class="box one"></div>
        <div class="box two"></div>
        <div class="box three"></div>
        </div>
    </div>

    <style>
    .wrapper{
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
    }
    
    .flex-container {
        display: flex;
        background: #ffffff;
        flex-wrap: wrap;
        flex-flow: row-reverse;
        height: 600px;
        justify-content: center;
    }

    .box{
        height: 100px;
        min-width: 200px;
    }

    .one{
        background: red;
    }

    .two{
        background: blue;
    }

    .three{
        background: green;
    }

    </style>
</body>
</html>
